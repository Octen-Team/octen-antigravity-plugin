name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v

  agy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Official installer from https://antigravity.google/docs/getting-started (it accepts only --dir and --help);
      # validation needs no sign-in.
      - name: Install the Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: agy --version
      - run: agy plugin validate --strict .
